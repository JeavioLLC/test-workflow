name: Promote - Deploy to QA

# Manual promotion step, run from the Actions tab ("Run workflow").
# Triggering this IS the developer's approval - GitHub Free (private
# repo) has no native Environment "Required reviewers" UI, so a human
# manually running this workflow is the approval gate. Only repo
# collaborators with Write access can trigger a workflow_dispatch, which
# is what restricts who may promote.
#
# image_tag is REQUIRED and must name the exact image you tested - it is
# never inferred from "whatever is currently deployed to Development".
# That environment is shared: if another developer merged to develop and
# redeployed Dev after your build, the "current" image would silently be
# theirs, not yours. Find your tag from the cd-develop.yml run for your
# merge commit (format: dev-<short-sha>, shown in its "Build & Push
# Image" step summary), or run `git rev-parse --short <your-commit>`.
# No rebuild happens - the exact image you name is deployed unchanged.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Exact image tag you tested in Development, e.g. dev-a1b2c3d (NOT left blank / NOT assumed)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  resolve-image:
    name: Resolve Image to Promote
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.resolve.outputs.image_uri }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image URI
        id: resolve
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${{ vars.ECR_REPOSITORY }}:${IMAGE_TAG}"
          echo "Promoting ${IMAGE_URI}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Sanity check against current Development deployment
        run: |
          CURRENT=$(aws ssm get-parameter \
            --name "/${{ vars.APP_NAME }}/development/current-image" \
            --query 'Parameter.Value' --output text 2>/dev/null || echo "unknown")
          if [ "${CURRENT}" != "${{ steps.resolve.outputs.image_uri }}" ]; then
            echo "::notice::Development currently has '${CURRENT}' deployed, which differs from the tag you're promoting. This is expected if Development has since moved on to someone else's build - double check you meant to promote your own tested image."
          fi

  deploy-qa:
    name: Deploy to QA
    needs: resolve-image
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment: qa
      image_uri: ${{ needs.resolve-image.outputs.image_uri }}
    secrets: inherit
