name: Deploy Template (ECS Fargate)

# Reusable deploy step shared by every stage of every pipeline
# (cd-develop.yml, promote-to-qa.yml, cd-release.yml,
# promote-to-production.yml) so the same, unchanged image is promoted to
# each environment (Section 3: Build Once, Deploy Anywhere).
#
# The human approval gates (dev -> qa, staging -> production) are NOT
# expressed here - this repo's GitHub plan doesn't support native
# Environment "Required reviewers". Instead, promotion to qa/production
# only happens when someone with repo Write access manually runs
# promote-to-qa.yml / promote-to-production.yml from the Actions tab -
# that manual trigger IS the approval. This job still targets
# `environment: <name>` purely to scope its variables/secrets per
# environment, not for protection rules.
#
# Each environment must define, as Environment variables/secrets:
#   vars.AWS_REGION, vars.ECS_CLUSTER, vars.ECS_SERVICE,
#   vars.ECS_TASK_DEFINITION_FAMILY, vars.CONTAINER_NAME, vars.APP_NAME
#   secrets.AWS_ROLE_ARN (OIDC role with ecs:* / ssm:PutParameter on that env's resources)
#
# Rollback is layered:
#   1. ECS's own Deployment Circuit Breaker (enabled below on every
#      deploy) automatically rolls back if the new tasks never reach a
#      healthy steady state - infra-level failures, no scripting needed,
#      happens within the deploy itself.
#   2. The "Verify deployment did not auto-rollback" step below detects
#      when (1) fired - `aws ecs wait services-stable` reports success
#      even after an internal circuit-breaker rollback, since the
#      service genuinely is stable, just back on the old revision - and
#      fails this job loudly so it isn't mistaken for a successful
#      deploy.
#   3. `previous_task_definition` is still exposed as an output so the
#      rollback job in promote-to-production.yml can force-redeploy it
#      if the deploy job itself fails for any other reason.

on:
  workflow_call:
    inputs:
      environment:
        description: "Target GitHub Environment name (development/qa/staging/production)"
        required: true
        type: string
      image_uri:
        description: "Full, immutable ECR image reference to deploy (e.g. <account>.dkr.ecr.<region>.amazonaws.com/<repo>:<tag>)"
        required: true
        type: string
    outputs:
      previous_task_definition:
        description: "Task definition ARN that was active before this deploy (used for rollback)"
        value: ${{ jobs.deploy.outputs.previous_task_definition }}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      previous_task_definition: ${{ steps.capture-previous.outputs.task_definition_arn }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Capture currently active task definition (for rollback)
        id: capture-previous
        run: |
          ARN=$(aws ecs describe-services \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}" \
            --query 'services[0].taskDefinition' --output text)
          echo "task_definition_arn=${ARN}" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_TASK_DEFINITION_FAMILY }}" \
            --query 'taskDefinition' > task-definition.json

      - name: Render new image into task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.CONTAINER_NAME }}
          image: ${{ inputs.image_uri }}

      - name: Enable ECS deployment circuit breaker (auto rollback)
        run: |
          CURRENT_CONFIG=$(aws ecs describe-services \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}" \
            --query 'services[0].deploymentConfiguration' --output json)

          MERGED_CONFIG=$(echo "${CURRENT_CONFIG}" | jq -c '.deploymentCircuitBreaker = {"enable": true, "rollback": true}')

          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --deployment-configuration "${MERGED_CONFIG}" \
            --no-cli-pager > /dev/null

      - name: Deploy to ECS Fargate
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true

      - name: Verify deployment did not auto-rollback
        run: |
          FINAL=$(aws ecs describe-services \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}" \
            --query 'services[0].taskDefinition' --output text)
          if [ "${FINAL}" == "${{ steps.capture-previous.outputs.task_definition_arn }}" ]; then
            echo "::error::ECS's deployment circuit breaker rolled this deployment back automatically - the service is still on the previous task definition (${FINAL}). Check ECS service events / task logs in ${{ vars.ECS_CLUSTER }}/${{ vars.ECS_SERVICE }} for why the new tasks failed to stabilize."
            exit 1
          fi
          echo "Service is now running ${FINAL}"

      - name: Record deployed version (traceability)
        run: |
          aws ssm put-parameter \
            --name "/${{ vars.APP_NAME }}/${{ inputs.environment }}/current-image" \
            --value "${{ inputs.image_uri }}" \
            --type String \
            --overwrite
