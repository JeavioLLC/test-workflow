name: CI - PR Validation

# Section 2 / Table 2 of the CI/CD Framework: every Pull Request into develop
# or main must pass these quality & security gates before it can be merged.
# The pipeline fails immediately if any mandatory job fails.

on:
  pull_request:
    branches:
      - develop
      - main
      - "release/**"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------
  # Linting & Style Checks
  # ---------------------------------------------------------------------
  lint:
    name: Linting & Style Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install lint tooling
        run: pip install -r requirements-ci.txt

      - name: Run ruff
        run: ruff check .

      - name: Run ruff (format check)
        run: ruff format --check .

  # ---------------------------------------------------------------------
  # Unit Tests & Code Coverage (threshold set by the COVERAGE_THRESHOLD
  # repo/org variable - Settings -> Secrets and variables -> Actions ->
  # Variables. Defaults to 80 if that variable isn't set.
  # ---------------------------------------------------------------------
  test:
    name: Unit Tests & Code Coverage
    runs-on: ubuntu-latest
    env:
      COVERAGE_THRESHOLD: ${{ vars.COVERAGE_THRESHOLD || '80' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run unit tests with coverage
        run: |
          echo "Enforcing minimum coverage: ${COVERAGE_THRESHOLD}%"
          pytest \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under="${COVERAGE_THRESHOLD}"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ---------------------------------------------------------------------
  # Prepare Jeavio Governance Tool
  # Fetches jeavio-governance.sh from AWS CodeArtifact ONCE and shares it
  # with every scan job below as a build artifact (Build Once, reuse
  # everywhere - same philosophy as the deploy pipeline) instead of every
  # scan job re-authenticating to CodeArtifact independently.
  # ---------------------------------------------------------------------
  prepare-governance-tool:
    name: Prepare Jeavio Governance Tool
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GOVERNANCE_AWS_ROLE_ARN }}
          aws-region: ${{ vars.GOVERNANCE_AWS_REGION || 'ap-south-1' }}

      - name: Download jeavio-governance script from CodeArtifact
        run: |
          latest_version=$(aws codeartifact list-package-versions --domain jeavio-governance --repository jeavio-governance --format generic --namespace jeavio-governance --package jeavio-governance --query 'versions[-1].version' --output text)
          aws codeartifact get-package-version-asset --domain jeavio-governance --repository jeavio-governance --format generic --namespace jeavio-governance --package jeavio-governance --package-version "$latest_version" --asset governance.zip governance.zip
          unzip -o governance.zip jeavio-governance.sh
          mv jeavio-governance.sh jeavio-governance
          chmod +x jeavio-governance

      - name: Upload governance tool artifact
        uses: actions/upload-artifact@v4
        with:
          name: jeavio-governance-tool
          path: jeavio-governance
          retention-days: 1

  # ---------------------------------------------------------------------
  # Secret Detection - jeavio-governance --scan (TEST_TYPE=detect-secrets)
  # ---------------------------------------------------------------------
  
  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    needs: prepare-governance-tool
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download jeavio-governance tool
        uses: actions/download-artifact@v4
        with:
          name: jeavio-governance-tool
          path: ${{ runner.temp }}/governance-tool

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GOVERNANCE_AWS_ROLE_ARN }}
          aws-region: ${{ vars.GOVERNANCE_AWS_REGION || 'ap-south-1' }}

      - name: Setup governance directories
        run: |
          chmod +x "${RUNNER_TEMP}/governance-tool/jeavio-governance"
          "${RUNNER_TEMP}/governance-tool/jeavio-governance" --setup --ci
          echo "HOME=${HOME}" >> "$GITHUB_ENV"

      - name: Generate config.env
        run: |
          cat > ~/jeavio-governance/config/config.env <<EOF
          PROJECT_NAME=${{ github.event.repository.name }}
          PROJECT_DIRECTORY=${{ github.workspace }}
          TECH_DOMAIN=web
          TECH_STACK=python
          TECH_STACK_VERSION=${{ env.PYTHON_VERSION }}
          TEST_TYPE=detect-secrets
          NUMBER_OF_LOG_FILES_TO_KEEP=3
          EOF

      - name: Run secret detection scan
        run: '"${RUNNER_TEMP}/governance-tool/jeavio-governance" --scan --ci'

      - name: Upload secret detection reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-detection-reports
          path: ${{ env.HOME }}/jeavio-governance/sast-reports
          retention-days: 14

  # ---------------------------------------------------------------------
  # Static Application Security Testing (SAST)
  # jeavio-governance --scan (TEST_TYPE=source-code-sast)
  # ---------------------------------------------------------------------
  sast-scan:
    name: SAST Scan
    runs-on: ubuntu-latest
    needs: prepare-governance-tool
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download jeavio-governance tool
        uses: actions/download-artifact@v4
        with:
          name: jeavio-governance-tool
          path: ${{ runner.temp }}/governance-tool

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GOVERNANCE_AWS_ROLE_ARN }}
          aws-region: ${{ vars.GOVERNANCE_AWS_REGION || 'ap-south-1' }}

      - name: Setup governance directories
        run: |
          chmod +x "${RUNNER_TEMP}/governance-tool/jeavio-governance"
          "${RUNNER_TEMP}/governance-tool/jeavio-governance" --setup --ci
          echo "HOME=${HOME}" >> "$GITHUB_ENV"

      - name: Generate config.env
        run: |
          cat > ~/jeavio-governance/config/config.env <<EOF
          PROJECT_NAME=${{ github.event.repository.name }}
          PROJECT_DIRECTORY=${{ github.workspace }}
          TECH_DOMAIN=web
          TECH_STACK=python
          TECH_STACK_VERSION=${{ env.PYTHON_VERSION }}
          TEST_TYPE=source-code-sast
          NUMBER_OF_LOG_FILES_TO_KEEP=3
          EOF

      - name: Run SAST scan
        run: '"${RUNNER_TEMP}/governance-tool/jeavio-governance" --scan --ci'

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-scan-reports
          path: ${{ env.HOME }}/jeavio-governance/sast-reports
          retention-days: 14

  # ---------------------------------------------------------------------
  # Dependency Vulnerability Scan
  # jeavio-governance --scan (TEST_TYPE=dependency-vuln)
  # ---------------------------------------------------------------------
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: prepare-governance-tool
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download jeavio-governance tool
        uses: actions/download-artifact@v4
        with:
          name: jeavio-governance-tool
          path: ${{ runner.temp }}/governance-tool

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GOVERNANCE_AWS_ROLE_ARN }}
          aws-region: ${{ vars.GOVERNANCE_AWS_REGION || 'ap-south-1' }}

      - name: Setup governance directories
        run: |
          chmod +x "${RUNNER_TEMP}/governance-tool/jeavio-governance"
          "${RUNNER_TEMP}/governance-tool/jeavio-governance" --setup --ci
          echo "HOME=${HOME}" >> "$GITHUB_ENV"

      - name: Generate config.env
        run: |
          cat > ~/jeavio-governance/config/config.env <<EOF
          PROJECT_NAME=${{ github.event.repository.name }}
          PROJECT_DIRECTORY=${{ github.workspace }}
          TECH_DOMAIN=web
          TECH_STACK=python
          TECH_STACK_VERSION=${{ env.PYTHON_VERSION }}
          TEST_TYPE=dependency-vuln
          NUMBER_OF_LOG_FILES_TO_KEEP=3
          EOF

      - name: Run dependency vulnerability scan
        run: '"${RUNNER_TEMP}/governance-tool/jeavio-governance" --scan --ci'

      - name: Upload dependency scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-reports
          path: ${{ env.HOME }}/jeavio-governance/sast-reports
          retention-days: 14

  # ---------------------------------------------------------------------
  # License Compliance Scan
  # jeavio-governance --scan (TEST_TYPE=dependency-license)
  # ---------------------------------------------------------------------
  license-scan:
    name: License Compliance Scan
    runs-on: ubuntu-latest
    needs: prepare-governance-tool
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download jeavio-governance tool
        uses: actions/download-artifact@v4
        with:
          name: jeavio-governance-tool
          path: ${{ runner.temp }}/governance-tool

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GOVERNANCE_AWS_ROLE_ARN }}
          aws-region: ${{ vars.GOVERNANCE_AWS_REGION || 'ap-south-1' }}

      - name: Setup governance directories
        run: |
          chmod +x "${RUNNER_TEMP}/governance-tool/jeavio-governance"
          "${RUNNER_TEMP}/governance-tool/jeavio-governance" --setup --ci
          echo "HOME=${HOME}" >> "$GITHUB_ENV"

      - name: Generate config.env
        run: |
          cat > ~/jeavio-governance/config/config.env <<EOF
          PROJECT_NAME=${{ github.event.repository.name }}
          PROJECT_DIRECTORY=${{ github.workspace }}
          TECH_DOMAIN=web
          TECH_STACK=python
          TECH_STACK_VERSION=${{ env.PYTHON_VERSION }}
          PACKAGE_MANAGER_VERSION=${{ vars.PIP_VERSION || '24.0' }}
          TEST_TYPE=dependency-license
          NUMBER_OF_LOG_FILES_TO_KEEP=3
          EOF

      - name: Run license compliance scan
        run: '"${RUNNER_TEMP}/governance-tool/jeavio-governance" --scan --ci'

      - name: Upload license scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-scan-reports
          path: ${{ env.HOME }}/jeavio-governance/sast-reports
          retention-days: 14

  # ---------------------------------------------------------------------
  # Quality Gate - fails the PR if any mandatory check above failed.
  # ---------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    if: always()
    needs:
      - lint
      - test
      - prepare-governance-tool
      - secret-detection
      - sast-scan
      - dependency-scan
      - license-scan
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" || "${{ contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more mandatory checks failed (or were skipped due to an upstream failure). Blocking merge."
            exit 1
          fi
          echo "All quality & security gates passed."
