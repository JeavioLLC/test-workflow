name: CD - Develop (Build & Deploy Dev)

# Feature branches merge into `develop`. As soon as code lands on develop
# we build ONE image and deploy it straight to Development for dev
# testing. The pipeline stops here - promotion to QA is a separate,
# manually-triggered workflow (promote-to-qa.yml) run from the Actions
# tab, since this repo's GitHub plan doesn't support native Environment
# "Required reviewers".
#
# Development is a SHARED environment: if two developers merge to
# develop close together, the second push's deploy-dev here will
# redeploy Development with a different image, on top of whoever is
# still testing. `concurrency` below only prevents two deploys from
# racing each other technically (corrupting the ECS deployment) - it
# does NOT prevent this overwrite; that's why promote-to-qa.yml requires
# you to name your exact tested image tag rather than trusting whatever
# is currently deployed.

on:
  push:
    branches:
      - develop
    paths:
      - "backend/**"

concurrency:
  group: deploy-development
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build & Push Image (develop)
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
      image_tag: ${{ steps.image.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_TAG="dev-$(git rev-parse --short HEAD)"
          IMAGE_URI="${ECR_REGISTRY}/${{ vars.ECR_REPOSITORY }}:${IMAGE_TAG}"
          docker build -t "${IMAGE_URI}" backend
          docker push "${IMAGE_URI}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: Deploy to Development
    needs: build
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment: development
      image_uri: ${{ needs.build.outputs.image_uri }}
    secrets: inherit
