name: Promote - Deploy to Production

# Manual promotion step, run from the Actions tab ("Run workflow").
# Triggering this IS the release approval, once Staging/UAT sign-off is
# done - GitHub Free (private repo) has no native Environment "Required
# reviewers" UI, so a human manually running this workflow is the
# approval gate. Only repo collaborators with Write access can trigger a
# workflow_dispatch, which is what restricts who may promote.
#
# image_tag is REQUIRED and must name the exact version you validated in
# Staging - it is never inferred from "whatever is currently deployed to
# Staging". That environment is shared: if another release branch was
# pushed and redeployed Staging after yours, the "current" image would
# silently be theirs, not the one you tested. Use the version from your
# release/v<version> branch name, e.g. 1.0.0. No rebuild happens - the
# exact image you name is deployed unchanged.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Exact version you validated in Staging, e.g. 1.0.0 (NOT left blank / NOT assumed)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  resolve-image:
    name: Resolve Image to Promote
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.resolve.outputs.image_uri }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image URI
        id: resolve
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${{ vars.ECR_REPOSITORY }}:${IMAGE_TAG}"
          echo "Promoting ${IMAGE_URI}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Sanity check against current Staging deployment
        run: |
          CURRENT=$(aws ssm get-parameter \
            --name "/${{ vars.APP_NAME }}/staging/current-image" \
            --query 'Parameter.Value' --output text 2>/dev/null || echo "unknown")
          if [ "${CURRENT}" != "${{ steps.resolve.outputs.image_uri }}" ]; then
            echo "::notice::Staging currently has '${CURRENT}' deployed, which differs from the version you're promoting. This is expected if Staging has since moved on to a newer release branch - double check you meant to promote this version."
          fi

  # ---------------------------------------------------------------------
  # Deploy/health-check/rollback are commented out until the ECS cluster
  # exists. Uncomment all three jobs once production's ECS
  # cluster/service/task-definition are set up (this workflow is
  # manual-only anyway, so it won't run until someone dispatches it -
  # commented out for consistency with the other pipelines while there's
  # no cluster to deploy to).
